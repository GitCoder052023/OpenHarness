[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openharness"
version = "0.1.0"
description = "OpenHarness by OpenAgent — The open execution harness for autonomous agents on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pynput>=1.7.7",
    "pillow>=11.3",
    "browser-harness>=0.1.9",
    "macos-harness>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
openharness = "openharness.cli:main"
OpenHarness = "openharness.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["openharness*", "OpenAgent*"]

[tool.uv.sources]
browser-harness = { workspace = true }
macos-harness = { workspace = true }

[tool.uv.workspace]
members = ["src/tools/macos-harness", "src/tools/browser-harness"]
